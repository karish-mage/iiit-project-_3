version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma_db
      - sqlite_data:/app/data
      - ./backend/data/synthetic:/app/data/synthetic
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - CHROMA_PERSIST_DIR=./data/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  chroma_data:
  sqlite_data:
